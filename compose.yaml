services:
  postgres:
    image: postgres:18
    container_name: budget-tracker-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: budget_tracker
      POSTGRES_USER: orion
      POSTGRES_PASSWORD: password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget_user -d budget_tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: