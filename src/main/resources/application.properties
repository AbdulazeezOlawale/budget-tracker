spring.application.name=budget-tracker

# Database connection
spring.datasource.url=jdbc:postgresql://localhost:5432/budget_tracker
spring.datasource.username=orion
spring.datasource.password=password

# Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway
spring.flyway.enabled=true

# generate once: openssl rand -base64 32
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-minutes=15
app.jwt.refresh-minutes=10080

# Brute-force brake per client IP on /register /login /refresh
app.rate-limit.auth-requests-per-minute=10